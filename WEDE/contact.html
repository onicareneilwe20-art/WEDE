<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkers · Contact</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <div class="container header-flex">

    <div class="logo-area">
      <i class="fas fa-shopping-basket logo-icon"></i>
      <div class="logo-text">Checkers<span> •</span></div>
    </div>

    <div class="nav-menu">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="product.html">Products</a>
      <a href="service.html">Services</a>
      <a href="contact.html" class="active">Contact</a>
    </div>

    <div class="header-icons">
      <i class="fas fa-search"></i>
      <i class="fas fa-user-circle"></i>
      <i class="fas fa-shopping-cart"></i>
    </div>

  </div>
</header>

<main>

  <section class="page">

    <div class="container">

      <h2 class="section-title">Get in Touch</h2>

      <p>
        We’d love to hear from you. Send us a message.
      </p>

      <div class="contact-form">

        <form id="contactForm">

          <div class="form-group">
            <label>Full Name</label>
            <input
              type="text"
              placeholder="Your full name"
              required
            >
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <input
              type="email"
              placeholder="you@example.com"
              required
            >
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input
              type="tel"
              placeholder="+27 12 345 6789"
            >
          </div>

          <div class="form-group">
            <label>Enquiry Type</label>

            <select>
              <option>General enquiry</option>
              <option>Online shopping</option>
              <option>Sixty60 delivery</option>
              <option>Xtra Savings</option>
              <option>Other</option>
            </select>
          </div>

          <div class="form-group">
            <label>Message</label>

            <textarea
              placeholder="How can we help?"
            ></textarea>
          </div>

          <button type="submit" class="btn-primary">
            Submit enquiry
          </button>

        </form>

        <p>
          <i class="fas fa-lock"></i>
          Your information is secure.
        </p>

      </div>

    </div>

  </section>

</main>

<footer class="footer">

  <div class="container">

    <div class="footer-flex">

      <div>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="#">Help</a>
        <a href="#">Stores</a>
      </div>

      <div class="footer-social">
        <i class="fab fa-facebook-f"></i>
        <i class="fab fa-instagram"></i>
        <i class="fab fa-twitter"></i>
        <i class="fab fa-youtube"></i>
      </div>

    </div>

    <div class="footer-copy">
      <span>
        © 2026 Checkers Holdings Ltd · Student prototype
      </span>
    </div>

  </div>

</footer>

<script>
  document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();

    alert('Thank you for your enquiry! (student prototype)');

    this.reset();
  });
</script>

</body>
</html>
```
